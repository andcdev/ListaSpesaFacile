<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#546E7A"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E88E5"/></marker>
    <marker id="a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7E57C2"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#E64A19"/></marker>
    <marker id="a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00897B"/></marker>
    <style>
      .t { font-size: 15px; fill: #263238; }
      .s { font-size: 13px; fill: #455A64; }
      .h { font-size: 18px; font-weight: 700; fill: #1B2429; }
      .hb { font-size: 15px; font-weight: 700; fill: #1B2429; }
      .mono { font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; font-size: 13px; fill: #37474F; }
      .lbl { font-size: 13px; font-weight: 600; }
      .num { font-size: 14px; font-weight: 700; fill: #fff; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="#FAFBFC"/>

  <!-- Titolo -->
  <text x="40" y="52" font-size="28" font-weight="800" fill="#1B2429">Lista Spesa Facile · architettura</text>
  <text x="40" y="80" class="s">Come l'app Flutter e il backend Laravel su VPS comunicano: REST per leggere/scrivere, WebSocket (Reverb) per gli aggiornamenti in tempo reale e la presenza.</text>

  <!-- ============ APP FLUTTER ============ -->
  <rect x="40" y="110" width="470" height="600" rx="18" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2"/>
  <text x="62" y="145" class="h">📱 App Flutter</text>
  <text x="62" y="167" class="s">Android · iOS · stesso codice Dart</text>

  <rect x="60" y="185" width="430" height="92" rx="10" fill="#fff" stroke="#90CAF9"/>
  <text x="76" y="210" class="hb">Schermate</text>
  <text x="76" y="234" class="t">Accesso / Registrazione · Liste per data e ora</text>
  <text x="76" y="256" class="t">Dettaglio lista (articoli, chi guarda) · Condivisione</text>

  <rect x="60" y="292" width="430" height="102" rx="10" fill="#fff" stroke="#90CAF9"/>
  <text x="76" y="317" class="hb">Stato (Provider)</text>
  <text x="76" y="341" class="mono">AuthController      sessione e token</text>
  <text x="76" y="361" class="mono">ListsController     elenco liste</text>
  <text x="76" y="381" class="mono">ListDetailController articoli + presenza</text>

  <rect x="60" y="410" width="430" height="84" rx="10" fill="#fff" stroke="#1E88E5" stroke-width="2"/>
  <text x="76" y="436" class="hb">ApiClient</text>
  <text x="76" y="459" class="t">REST · JSON · Authorization: Bearer &lt;token&gt;</text>
  <text x="76" y="480" class="s">login, liste, articoli, condivisioni, auth dei canali</text>

  <rect x="60" y="508" width="430" height="100" rx="10" fill="#fff" stroke="#7E57C2" stroke-width="2"/>
  <text x="76" y="534" class="hb">RealtimeClient</text>
  <text x="76" y="557" class="t">WebSocket, protocollo Pusher v7</text>
  <text x="76" y="578" class="s">iscrizione ai canali, ping/pong, riconnessione</text>
  <text x="76" y="597" class="s">automatica con ricarica dei dati persi</text>

  <rect x="60" y="622" width="430" height="70" rx="10" fill="#fff" stroke="#90CAF9"/>
  <text x="76" y="648" class="hb">SessionStorage</text>
  <text x="76" y="672" class="t">token in secure storage · indirizzo del server</text>

  <!-- Altri dispositivi -->
  <rect x="40" y="740" width="470" height="120" rx="18" fill="#E3F2FD" stroke="#1E88E5" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="62" y="775" class="h">📱📱 Altri dispositivi</text>
  <text x="62" y="800" class="t">Gli utenti con cui la lista è condivisa: stessa app,</text>
  <text x="62" y="821" class="t">iscritti agli stessi canali, ricevono le modifiche</text>
  <text x="62" y="842" class="t">nello stesso istante.</text>

  <!-- ============ VPS ============ -->
  <rect x="590" y="110" width="1170" height="750" rx="22" fill="#F5F5F5" stroke="#90A4AE" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="614" y="145" class="h">🖥 VPS · docker compose</text>
  <text x="614" y="167" class="s">una sola porta pubblica (443), rete interna tra i container</text>

  <!-- Caddy -->
  <rect x="620" y="320" width="250" height="310" rx="14" fill="#E8F5E9" stroke="#43A047" stroke-width="2"/>
  <text x="640" y="352" class="h">caddy</text>
  <text x="640" y="374" class="s">reverse proxy · porte 80/443</text>
  <text x="640" y="402" class="t">HTTPS automatico</text>
  <text x="640" y="422" class="t">(Let's Encrypt)</text>
  <line x1="640" y1="442" x2="850" y2="442" stroke="#A5D6A7"/>
  <text x="640" y="468" class="mono">/api/*  → app:9000</text>
  <text x="640" y="490" class="s">FastCGI verso PHP-FPM</text>
  <text x="640" y="524" class="mono">/app/*  → reverb:8080</text>
  <text x="640" y="546" class="s">proxy WebSocket</text>

  <!-- app Laravel -->
  <rect x="960" y="190" width="470" height="370" rx="14" fill="#FBE9E7" stroke="#E64A19" stroke-width="2"/>
  <text x="980" y="222" class="h">app · Laravel 13</text>
  <text x="980" y="244" class="s">PHP-FPM 8.5 · esegue le migrazioni all'avvio</text>

  <rect x="978" y="258" width="434" height="62" rx="8" fill="#fff" stroke="#FFAB91"/>
  <text x="992" y="281" class="hb">Controller API</text>
  <text x="992" y="305" class="s">Auth · Liste · Articoli · Condivisioni · Condivisione globale</text>

  <rect x="978" y="330" width="210" height="62" rx="8" fill="#fff" stroke="#FFAB91"/>
  <text x="992" y="353" class="hb">Sanctum</text>
  <text x="992" y="377" class="s">verifica il token</text>
  <rect x="1202" y="330" width="210" height="62" rx="8" fill="#fff" stroke="#FFAB91"/>
  <text x="1216" y="353" class="hb">Policy</text>
  <text x="1216" y="377" class="s">owner · edit · view</text>

  <rect x="978" y="402" width="434" height="62" rx="8" fill="#fff" stroke="#FFAB91"/>
  <text x="992" y="425" class="hb">/api/broadcasting/auth</text>
  <text x="992" y="449" class="s">decide chi può ascoltare quale canale</text>

  <rect x="978" y="474" width="434" height="72" rx="8" fill="#fff" stroke="#FFAB91"/>
  <text x="992" y="497" class="hb">Eventi broadcast</text>
  <text x="992" y="518" class="mono">item.saved · item.deleted · list.updated</text>
  <text x="992" y="537" class="mono">list.deleted · lists.changed</text>

  <!-- MySQL -->
  <rect x="1500" y="190" width="240" height="370" rx="14" fill="#E0F2F1" stroke="#00897B" stroke-width="2"/>
  <text x="1520" y="222" class="h">mysql 8.4</text>
  <text x="1520" y="244" class="s">volume persistente</text>
  <text x="1520" y="284" class="mono">users</text>
  <text x="1520" y="310" class="mono">personal_access_tokens</text>
  <text x="1520" y="336" class="mono">shopping_lists</text>
  <text x="1534" y="356" class="s">nome, note, scheduled_at</text>
  <text x="1520" y="384" class="mono">list_items</text>
  <text x="1534" y="404" class="s">quantità, spuntato, da chi</text>
  <text x="1520" y="432" class="mono">shopping_list_user</text>
  <text x="1534" y="452" class="s">condivisione per lista</text>
  <text x="1520" y="480" class="mono">global_shares</text>
  <text x="1534" y="500" class="s">condivisione di tutte le liste</text>

  <!-- Reverb -->
  <rect x="960" y="640" width="780" height="195" rx="14" fill="#EDE7F6" stroke="#7E57C2" stroke-width="2"/>
  <text x="980" y="672" class="h">reverb · server WebSocket</text>
  <text x="980" y="694" class="s">Laravel Reverb · protocollo Pusher · inoltra gli eventi agli iscritti</text>
  <rect x="978" y="710" width="370" height="108" rx="8" fill="#fff" stroke="#B39DDB"/>
  <text x="992" y="736" class="mono" font-weight="700">presence-list.{id}</text>
  <text x="992" y="760" class="s">una per lista aperta: modifiche agli articoli</text>
  <text x="992" y="780" class="s">e alla lista, più l'elenco di chi la sta</text>
  <text x="992" y="800" class="s">guardando (entra / esce)</text>
  <rect x="1362" y="710" width="360" height="108" rx="8" fill="#fff" stroke="#B39DDB"/>
  <text x="1376" y="736" class="mono" font-weight="700">private-App.Models.User.{id}</text>
  <text x="1376" y="760" class="s">canale personale: "le tue liste sono</text>
  <text x="1376" y="780" class="s">cambiate" (creata, eliminata, condivisa,</text>
  <text x="1376" y="800" class="s">revocata) → l'app ricarica l'elenco</text>

  <!-- ============ FRECCE ============ -->
  <!-- 1 REST app → caddy -->
  <line x1="490" y1="452" x2="616" y2="452" stroke="#1E88E5" stroke-width="3" marker-end="url(#a-blue)"/>
  <text x="498" y="440" class="lbl" fill="#1E88E5" font-size="12">HTTPS REST</text>
  <!-- WSS app ↔ caddy -->
  <line x1="494" y1="558" x2="616" y2="558" stroke="#7E57C2" stroke-width="3" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <text x="512" y="546" class="lbl" fill="#7E57C2">WSS</text>
  <!-- altri dispositivi ↔ caddy -->
  <path d="M510,800 L745,800 L745,634" fill="none" stroke="#7E57C2" stroke-width="3" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <text x="560" y="790" class="lbl" fill="#7E57C2">WSS + HTTPS</text>
  <!-- caddy → app -->
  <line x1="870" y1="462" x2="956" y2="462" stroke="#E64A19" stroke-width="3" marker-end="url(#a-red)"/>
  <text x="880" y="452" class="lbl" fill="#E64A19">FastCGI</text>
  <!-- caddy ↔ reverb -->
  <path d="M870,535 L915,535 L915,740 L956,740" fill="none" stroke="#7E57C2" stroke-width="3" marker-start="url(#a-purple)" marker-end="url(#a-purple)"/>
  <text x="878" y="590" class="lbl" fill="#7E57C2">:8080</text>
  <!-- app ↔ mysql -->
  <line x1="1434" y1="375" x2="1496" y2="375" stroke="#00897B" stroke-width="3" marker-start="url(#a-teal)" marker-end="url(#a-teal)"/>
  <text x="1450" y="356" class="lbl" fill="#00897B">SQL</text>
  <!-- app → reverb -->
  <line x1="1195" y1="560" x2="1195" y2="636" stroke="#E64A19" stroke-width="3" marker-end="url(#a-red)"/>
  <text x="1207" y="596" class="lbl" fill="#E64A19">pubblica evento</text>
  <text x="1207" y="614" class="s">HTTP interno, firmato</text>

  <!-- Numeri del flusso -->
  <g>
    <circle cx="553" cy="475" r="14" fill="#1B2429"/><text x="553" y="480" text-anchor="middle" class="num">1</text>
    <circle cx="1465" cy="398" r="14" fill="#1B2429"/><text x="1465" y="403" text-anchor="middle" class="num">2</text>
    <circle cx="1175" cy="598" r="14" fill="#1B2429"/><text x="1175" y="603" text-anchor="middle" class="num">3</text>
    <circle cx="936" cy="680" r="14" fill="#1B2429"/><text x="936" y="685" text-anchor="middle" class="num">4</text>
    <circle cx="553" cy="582" r="14" fill="#1B2429"/><text x="553" y="587" text-anchor="middle" class="num">5</text>
  </g>

  <!-- ============ SEQUENZA ============ -->
  <text x="40" y="910" class="h">Esempio: Bruno aggiunge «Latte» mentre Anna guarda la stessa lista</text>

  <g>
    <rect x="40" y="930" width="328" height="150" rx="12" fill="#fff" stroke="#1E88E5" stroke-width="2"/>
    <circle cx="68" cy="960" r="14" fill="#1B2429"/><text x="68" y="965" text-anchor="middle" class="num">1</text>
    <text x="92" y="966" class="hb">Richiesta REST</text>
    <text x="58" y="996" class="t">L'app di Bruno invia</text>
    <text x="58" y="1018" class="mono">POST /api/lists/7/items</text>
    <text x="58" y="1040" class="t">con il suo token.</text>

    <rect x="388" y="930" width="328" height="150" rx="12" fill="#fff" stroke="#00897B" stroke-width="2"/>
    <circle cx="416" cy="960" r="14" fill="#1B2429"/><text x="416" y="965" text-anchor="middle" class="num">2</text>
    <text x="440" y="966" class="hb">Controllo e salvataggio</text>
    <text x="406" y="996" class="t">Laravel verifica token e permesso</text>
    <text x="406" y="1018" class="t">(owner o edit) e salva l'articolo</text>
    <text x="406" y="1040" class="t">in MySQL.</text>

    <rect x="736" y="930" width="328" height="150" rx="12" fill="#fff" stroke="#E64A19" stroke-width="2"/>
    <circle cx="764" cy="960" r="14" fill="#1B2429"/><text x="764" y="965" text-anchor="middle" class="num">3</text>
    <text x="788" y="966" class="hb">Evento</text>
    <text x="754" y="996" class="t">Laravel pubblica</text>
    <text x="754" y="1018" class="mono">item.saved → presence-list.7</text>
    <text x="754" y="1040" class="mono">lists.changed → canali utente</text>

    <rect x="1084" y="930" width="328" height="150" rx="12" fill="#fff" stroke="#7E57C2" stroke-width="2"/>
    <circle cx="1112" cy="960" r="14" fill="#1B2429"/><text x="1112" y="965" text-anchor="middle" class="num">4</text>
    <text x="1136" y="966" class="hb">Inoltro WebSocket</text>
    <text x="1102" y="996" class="t">Reverb spinge l'evento a tutti</text>
    <text x="1102" y="1018" class="t">i dispositivi iscritti al canale,</text>
    <text x="1102" y="1040" class="t">passando da Caddy (wss://).</text>

    <rect x="1432" y="930" width="328" height="150" rx="12" fill="#fff" stroke="#1E88E5" stroke-width="2"/>
    <circle cx="1460" cy="960" r="14" fill="#1B2429"/><text x="1460" y="965" text-anchor="middle" class="num">5</text>
    <text x="1484" y="966" class="hb">Aggiornamento immediato</text>
    <text x="1450" y="996" class="t">L'app di Anna inserisce «Latte»</text>
    <text x="1450" y="1018" class="t">nella lista senza ricaricare;</text>
    <text x="1450" y="1040" class="t">l'elenco aggiorna i contatori.</text>
  </g>

  <!-- Note -->
  <rect x="40" y="1100" width="1720" height="116" rx="12" fill="#FFF8E1" stroke="#FFCA28"/>
  <text x="60" y="1130" class="hb">Presenza e affidabilità</text>
  <text x="60" y="1156" class="t">• Aprendo una lista l'app si iscrive a presence-list.{id}; l'iscrizione è autorizzata da POST /api/broadcasting/auth. Reverb comunica chi entra ed esce → «Qui ora: Anna, Bruno».</text>
  <text x="60" y="1180" class="t">• Se Reverb non è raggiungibile le scritture vanno comunque a buon fine; alla riconnessione l'app ricarica i dati e recupera ciò che ha perso.</text>
  <text x="60" y="1204" class="t">• Se la lista viene eliminata o la condivisione revocata mentre è aperta, l'app lo scopre dal canale e chiude la schermata.</text>
</svg>
